<svg data-template-version="1.13" data-source-id="travel_extension" data-kind="core-extension" data-face="basic" data-footprint="generic-extension" data-size-hexes="1" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="60mm" height="51.9615mm" viewBox="0 0 1000 866.0254" role="img" aria-labelledby="title desc">
  <title id="title">Travel Extension &#x2014; Core basic</title>
  <desc id="desc">Dimension-locked 60 millimetre generic basic Travel extension for both two-hex and three-hex Travel components, with the standard artwork window and assembly-count guidance.</desc>
  <defs>
    <clipPath id="trim-clip"><path d="M250 0H750L1000 433.0127 750 866.0254H250L0 433.0127Z"/></clipPath>
    <clipPath id="artwork-clip"><path d="M163 150H837L998.261 430H1.739Z"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf6e9"/><stop offset=".55" stop-color="#f4ead6"/><stop offset="1" stop-color="#ede0c8"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#314230"/><stop offset=".55" stop-color="#2f342e"/><stop offset="1" stop-color="#394340"/></linearGradient>
    <linearGradient id="effect" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#314230"/><stop offset="1" stop-color="#26221b"/></linearGradient>
    <pattern id="paper-fibres" width="62" height="30" patternUnits="userSpaceOnUse"><path d="M2 8c14-5 25 4 39-1 8-3 14-1 19 1M8 22c10-3 22 2 35-1 6-2 12-1 17 1" fill="none" stroke="#d8caaa" stroke-width="1.2" opacity=".34"/></pattern>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="128%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#151711" flood-opacity=".24"/></filter>
    <style>
      @font-face{font-family:Almendra;src:url('../../../src/assets/fonts/almendra-latin-regular.woff2') format('woff2');font-weight:400}
      @font-face{font-family:'Alegreya Sans';src:url('../../../src/assets/fonts/alegreya-sans-latin-medium.woff2') format('woff2');font-weight:500}
      text{font-family:Almendra,Georgia,serif;fill:#26221b}
      .title{font-family:Almendra,Georgia,serif;font-size:48px;fill:#fbf6e9}
      .side,.row-label,.extension-instruction{font-family:'Alegreya Sans',Arial,sans-serif;font-weight:500}
      .side{font-size:22px;fill:#d8caaa;letter-spacing:4px}
      .row-label{font-size:27px;fill:#50665c;letter-spacing:4px}
      .extension-instruction{font-size:27px;fill:#26221b;letter-spacing:.6px;word-spacing:4px}
      .artwork-placeholder{font-family:Almendra,Georgia,serif;fill:#50665c;opacity:.72}
    </style>
  </defs>

  <g id="background" inkscape:groupmode="layer" inkscape:label="Background" filter="url(#soft-shadow)" clip-path="url(#trim-clip)">
    <rect width="1000" height="866.0254" fill="url(#paper)"/>
    <rect width="1000" height="866.0254" fill="url(#paper-fibres)"/>
    <path d="M250 0H750L837 150H163Z" fill="url(#header)"/>
    <path d="M1.739 430H998.261L909.363 590H90.637Z" fill="#f4ead6"/>
    <path d="M90.637 590H909.363L750 866.0254H250Z" fill="url(#effect)"/>
  </g>

  <g id="artwork" inkscape:groupmode="layer" inkscape:label="ARTWORK — INSERT HERE" clip-path="url(#artwork-clip)">
    <text class="artwork-placeholder" data-field="artwork-image-1" x="500" y="245.82" text-anchor="middle" style="font-size:78px" data-safe-width="640.37">Travel Extension</text>
    <text class="artwork-placeholder" data-field="artwork-image-2" x="500" y="339.42" text-anchor="middle" style="font-size:78px" data-safe-width="748.19">Image</text>
  </g>

  <g id="structure" inkscape:groupmode="layer" inkscape:label="Locked structure">
    <path d="M1.739 430H998.261M90.637 590H909.363" fill="none" stroke="#50665c" stroke-width="5"/>
    <path d="M44.449 510H955.551M250 438V582" fill="none" stroke="#6d8378" stroke-width="2.5"/>
  </g>

  <g id="content" inkscape:groupmode="layer" inkscape:label="Editable content">
    <metadata>
      <tile-extension id="travel_extension" face="basic" category="travel" compatible-source-tile-ids="c16_street c17_track" compatible-component-sizes="2 3" copies="14" artwork-window="standard" street-extension-count="1" track-extension-count="2"/>
    </metadata>
    <text class="title" data-field="extension-title" x="500" y="74" text-anchor="middle">Travel Extension</text>
    <text class="side" data-field="extension-face" x="500" y="125" text-anchor="middle">CORE • BASIC</text>
    <text class="row-label" data-field="street-extension-label" x="105" y="481">STREET</text>
    <text class="extension-instruction" data-field="street-extension-count" x="603" y="481" text-anchor="middle">USE 1 TRAVEL EXTENSION HEX</text>
    <text class="row-label" data-field="track-extension-label" x="105" y="561">TRACK</text>
    <text class="extension-instruction" data-field="track-extension-count" x="603" y="561" text-anchor="middle">USE 2 TRAVEL EXTENSION HEXES</text>
  </g>

  <g id="trim" inkscape:groupmode="layer" inkscape:label="Trim geometry — not printer bleed">
    <path d="M250 0H750L1000 433.0127 750 866.0254H250L0 433.0127Z" fill="none" stroke="#6d8378" stroke-width="18" stroke-linejoin="round"/>
    <path d="M250 0H750L1000 433.0127 750 866.0254H250L0 433.0127Z" fill="none" stroke="#26221b" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
